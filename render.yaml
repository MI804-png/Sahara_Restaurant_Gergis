services:
  - type: web
    name: sahara-restaurant
    runtime: node
    region: us-east1
    plan: free
    nodeVersion: 18
    
    # GitHub repository configuration
    repo: https://github.com/MI804-png/Sahara_Restaurant_Gergis
    branch: main
    autoDeploy: true
    
    # Build configuration
    buildCommand: npm install && cd site && npm install && npm run build && cd ..
    
    # Start command - runs both backend and frontend
    startCommand: node production-server.js
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
    
    # Health check
    healthCheckPath: /
    healthCheckInterval: 30

# Render Cron Jobs (optional - for future monitoring/maintenance)
# cronJobs:
